    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">

    <main class="container my-5 d-flex justify-content-center">
        <div class="card p-4 shadow" style="max-width: 400px; width: 100%;">
            <h3 class="text-center mb-3">تسجيل الدخول</h3>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="******">
                </div>
                <button type="submit" class="btn btn-dark w-100">دخول</button>
            </form>
        </div>
    </main>
