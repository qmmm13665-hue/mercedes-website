<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | مرسيدس بنز</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <header>
        <nav class="nav-container">
            <a href="index.html" class="logo">MERCEDES</a>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="categories.html">فئات السيارات</a></li>
                <li><a href="cart.html">سلة المحفوظات 🛒</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
                <li><a href="login.html">تسجيل الدخول</a></li>
                <li><a href="register.html" class="active">إنشاء حساب</a></li>
            </ul>
        </nav>
    </header>

    <main class="container my-5 d-flex justify-content-center">
        <div class="card p-4 shadow" style="max-width: 450px; width: 100%;">
            <h3 class="text-center mb-3">إنشاء حساب جديد</h3>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">الاسم الكامل</label>
                    <input type="text" id="regName" class="form-control" placeholder="اسمك">
                </div>
                <div class="mb-3">
                    <label class="form-label">البريد الإلكتروني</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور</label>
                    <input type="password" id="regPass" class="form-control" placeholder="******">
                </div>
                <button type="submit" class="btn btn-success w-100">تسجيل</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة لشركة مرسيدس بنز</p>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
